[project]
name = "textrieve"
version = "1.2.0"
description = "Free, fully-open image & PDF-to-text (OCR). CLI, REST API, and a clean web UI."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["ocr", "pdf", "image-to-text", "text-extraction", "rapidocr", "onnx", "cli", "rest-api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "rapidocr-onnxruntime>=1.3",
    "numpy>=1.24",
    "pypdfium2>=4.30",
]

[project.urls]
Homepage = "https://textrieve.onrender.com"
Repository = "https://github.com/dsk-dev-ai/textrieve"
Documentation = "https://github.com/dsk-dev-ai/textrieve#readme"
Funding = "https://github.com/sponsors/dsk-dev-ai"

[project.scripts]
textrieve = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "cli", "ocr"]
include-package-data = true

[tool.setuptools.data-files]
"textrieve_web" = [
    "web/app.js",
    "web/favicon.ico",
    "web/favicon.svg",
    "web/index.html",
    "web/styles.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]