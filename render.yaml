services:
  - type: web
    name: textrieve
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port "$PORT" --workers 1
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: TEXTRIEVE_PERMITS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_WAIT_POLICY
        value: "PASSIVE"