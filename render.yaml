services:
  - type: web
    name: textrieve
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port "$PORT" --workers 1
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"